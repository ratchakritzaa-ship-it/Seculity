<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatternScan QC VISION (Adaptive Scale)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oxanium:wght@700&display=swap');
        
        :root { 
            --primary: #0284c7; 
            --success: #0d9488; 
            --danger: #ef4444; 
            --bg: #f1f5f9; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            padding: 16px; 
            margin: 0; 
        }
        
        .panel { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 16px; 
        }
        
        .panel-title { 
            font-size: 0.75rem; 
            color: #64748b; 
            font-weight: 700; 
            margin-bottom: 12px; 
            font-family: 'Oxanium', sans-serif; 
        }
        
        .display-box { 
            border: 1px dashed #cbd5e1; 
            border-radius: 10px; 
            aspect-ratio: 4/3; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative; 
            background-color: #fafafa;
        }
        
        .display-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
        
        .file-input-wrapper {
            margin-top: 12px;
            width: 100%;
        }
        
        .btn-primary { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-family: 'Oxanium', sans-serif; 
            font-size: 1rem;
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.2s;
        }
        
        .btn-primary:disabled { 
            background: #cbd5e1; 
            cursor: not-allowed;
        }
        
        .result-card { 
            padding: 16px; 
            border-radius: 10px; 
            text-align: center; 
            margin-top: 16px; 
            display: none; 
            font-size: 0.9rem;
        }
    </style>
    <!-- โหลด OpenCV.js[cite: 7] -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body>

    <div class="panel">
        <div class="panel-title">1. รูปแบบกลุ่มจุดอ้างอิง (REFERENCE)</div>
        <div class="display-box"><img id="refImage"></div>
        <input type="file" id="fileInput" class="file-input-wrapper" accept="image/*">
    </div>

    <div class="panel">
        <div class="panel-title">2. ภาพตรวจทานหน้างาน (TARGET SCAN - Adaptive Scaling)</div>
        <div class="display-box"><img id="targetImage"></div>
        <input type="file" id="fileInputTarget" class="file-input-wrapper" accept="image/*">
    </div>

    <button class="btn-primary" id="btnScan" disabled>กำลังโหลดเอนจิน...</button>

    <div id="resultCard" class="result-card">
        <div id="resultText" style="font-weight: 700;"></div>
    </div>

    <script>
        const refImage = document.getElementById('refImage');
        const targetImage = document.getElementById('targetImage');
        const btnScan = document.getElementById('btnScan');
        const resultCard = document.getElementById('resultCard');
        const resultText = document.getElementById('resultText');

        let isReady = false;

        function onOpenCvReady() {
            isReady = true;
            btnScan.innerText = "ตรวจสอบจุด (Adaptive Mode)";
            checkReady();
        }

        document.getElementById('fileInput').onchange = (e) => { 
            refImage.src = URL.createObjectURL(e.target.files[0]); 
            checkReady(); 
        };
        
        document.getElementById('fileInputTarget').onchange = (e) => { 
            targetImage.src = URL.createObjectURL(e.target.files[0]); 
            checkReady(); 
        };

        function checkReady() { 
            if (isReady && refImage.src && targetImage.src) {
                btnScan.disabled = false;
            } else {
                btnScan.disabled = true;
            }
        }

        // ฟังก์ชันรองพื้นหลังขาว[cite: 7]
        function getMatWithWhiteBg(imgElement) {
            let canvas = document.createElement('canvas');
            let w = imgElement.naturalWidth || imgElement.width || 320;
            let h = imgElement.naturalHeight || imgElement.height || 240;
            canvas.width = w; 
            canvas.height = h;
            
            let ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(imgElement, 0, 0, w, h);
            
            return cv.imread(canvas);
        }

        // ฟังก์ชันตรวจจับที่ปรับค่า Area เป็น Relative[cite: 7]
        function getDots(imgElement) {
            let mat = getMatWithWhiteBg(imgElement);
            let hsv = new cv.Mat();
            
            cv.cvtColor(mat, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
            
            let mask = new cv.Mat();
            // ค่าสี Cyan[cite: 7]
            let low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [80, 100, 100, 0]);
            let high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [105, 255, 255, 255]);
            cv.inRange(hsv, low, high, mask);
            
            let contours = new cv.MatVector();
            cv.findContours(mask, contours, new cv.Mat(), cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
            
            let pts = [];
            let imgArea = mat.cols * mat.rows; // พื้นที่ภาพรวม[cite: 7]
            
            for (let i = 0; i < contours.size(); ++i) {
                let rect = cv.boundingRect(contours.get(i));
                let area = rect.width * rect.height;
                
                // ปรับเกณฑ์ขนาดจุดให้สัมพันธ์กับขนาดภาพ (แทนที่ค่าคงที่ 300)[cite: 7]
                if (area >= (imgArea * 0.000005) && area <= (imgArea * 0.05)) { 
                    pts.push({
                        x: rect.x + rect.width/2, 
                        y: rect.y + rect.height/2,
                        width: mat.cols // เก็บความกว้างภาพไว้เทียบ Tolerance[cite: 7]
                    });
                }
            }
            
            mat.delete(); hsv.delete(); mask.delete(); low.delete(); high.delete(); contours.delete();
            return pts;
        }

        btnScan.onclick = () => {
            resultCard.style.display = 'none';
            btnScan.innerText = "กำลังประมวลผล...";
            btnScan.disabled = true;

            setTimeout(() => {
                try {
                    let p1 = getDots(refImage);
                    let p2 = getDots(targetImage);
                    
                    resultCard.style.display = 'block';
                    
                    if (p1.length !== p2.length || p1.length === 0) {
                        resultText.innerText = `FAIL // จำนวนจุดไม่เท่ากัน (อ้างอิง: ${p1.length} | สแกน: ${p2.length})`;
                        resultCard.style.background = 'var(--danger)'; 
                        resultCard.style.color = 'white';
                        btnScan.innerText = "ตรวจสอบจุด (Adaptive Mode)";
                        btnScan.disabled = false;
                        return;
                    }

                    let matchCount = 0;
                    // ใช้ 5% ของความกว้างภาพ แทน 15 พิกเซลแบบเดิม[cite: 7]
                    let tolerance = (p1[0].width || 1000) * 0.05; 

                    p1.forEach(pt1 => {
                        let matched = false;
                        p2.forEach(pt2 => {
                            if (!matched) {
                                let dist = Math.hypot(pt1.x - pt2.x, pt1.y - pt2.y);
                                if (dist <= tolerance) {
                                    matchCount++;
                                    matched = true;
                                }
                            }
                        });
                    });

                    if (matchCount === p1.length) {
                        resultText.innerText = `PASS // ผ่าน! (${matchCount}/${p1.length} จุดตรงกัน)`;
                        resultCard.style.background = 'var(--success)'; 
                        resultCard.style.color = 'white';
                    } else {
                        resultText.innerText = `FAIL // ตำแหน่งคลาดเคลื่อน (เจอ ${matchCount} จาก ${p1.length} จุด)`;
                        resultCard.style.background = 'var(--danger)'; 
                        resultCard.style.color = 'white';
                    }

                } catch (err) {
                    console.error("OpenCV Error:", err);
                    alert("เกิดข้อผิดพลาดในการประมวลผล");
                }

                btnScan.innerText = "ตรวจสอบจุด (Adaptive Mode)";
                btnScan.disabled = false;
            }, 100);
        };
    </script>
</body>
</html>
